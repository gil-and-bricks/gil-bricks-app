<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gil &amp; Bricks Deal Analyser</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Brand header + first-run hint live OUTSIDE #app (root() clears #app),
         so they persist across every screen. Populated once at init (E10). -->
    <header id="gb-header" class="gb-header"></header>
    <div id="gb-firstrun"></div>
    <main id="app" class="panel"></main>
    <!-- Persistent SR live region OUTSIDE #app (root() clears #app), so lever
         change-signals are announced to screen-reader users (E8.1). -->
    <div id="gb-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
