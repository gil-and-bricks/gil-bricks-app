name: keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# This tiny weekly commit keeps the monthly data-refresh alive.
on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive heartbeat" || echo "nothing to commit"
          git pull --rebase || true
          git push

      # ---- IF THIS FAILED, SAY SO WHERE IT WILL BE SEEN -----------------------
      # A red tick in a tab nobody opens is not a warning. This opens an issue
      # and ASSIGNS it, because GitHub emails an assignee. One issue per
      # problem, not one per month: a repeat failure comments on the open one.
      - name: Raise an issue if this failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'The keepalive heartbeat failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly keepalive commit failed. GitHub disables scheduled workflows after 60 days without repo activity, so if this keeps failing the MONTHLY DATA REFRESH will stop running — silently.',
              '',
              `Run: ${run}`,
              '',
              'Nothing is wrong with the site yet. Fix this before the 60 days run out, or push any commit to reset the clock.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.data.find((i) => i.title === TITLE);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              core.notice(`commented on existing issue #${existing.number}`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
                assignees: [context.repo.owner],
              });
              core.notice(`opened issue #${made.data.number}`);
            }
