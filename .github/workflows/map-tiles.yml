name: map-tiles

# Manual (yearly-ish) refresh of the England & Wales basemap extract —
# see docs/MAP_OPERATOR_NOTE.md. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      build_date:
        description: "Protomaps daily build date (YYYYMMDD); leave empty for yesterday's"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pmtiles CLI
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/

      - name: Extract England & Wales (z0-14)
        run: |
          BUILD="${{ github.event.inputs.build_date }}"
          [ -z "$BUILD" ] && BUILD=$(date -u -d 'yesterday' +%Y%m%d)
          echo "Using Protomaps build $BUILD"
          cd packages/web && mkdir -p pipeline/.data/map
          pmtiles extract "https://build.protomaps.com/$BUILD.pmtiles" pipeline/.data/map/ew.pmtiles \
            --bbox=-6.5,49.8,1.8,55.9 --maxzoom=14
          ls -la pipeline/.data/map/ew.pmtiles

      - name: Upload to R2 (S3 endpoint, streaming PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd packages/web && node pipeline/upload-tiles.mjs

      - name: Verify object is live
        run: |
          curl -s -o /dev/null -w 'HEAD map/ew.pmtiles: %{http_code}\n' -I https://pub-ed7263f454104eb1a02055393ee15800.r2.dev/map/ew.pmtiles

      # ---- IF THIS FAILED, SAY SO WHERE IT WILL BE SEEN -----------------------
      # A red tick in a tab nobody opens is not a warning. This opens an issue
      # and ASSIGNS it, because GitHub emails an assignee. One issue per
      # problem, not one per month: a repeat failure comments on the open one.
      - name: Raise an issue if this failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'The map tiles refresh failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The England & Wales basemap extract failed to build or upload.',
              '',
              `Run: ${run}`,
              '',
              'The site keeps serving the existing tiles, so the map still works. This job is manual, so you probably already know — the issue is here so it is not lost.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.data.find((i) => i.title === TITLE);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              core.notice(`commented on existing issue #${existing.number}`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
                assignees: [context.repo.owner],
              });
              core.notice(`opened issue #${made.data.number}`);
            }
