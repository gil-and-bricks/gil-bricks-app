name: map-tiles

# Manual (yearly-ish) refresh of the England & Wales basemap extract —
# see docs/MAP_OPERATOR_NOTE.md. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      build_date:
        description: "Protomaps daily build date (YYYYMMDD); leave empty for yesterday's"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pmtiles CLI
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/

      - name: Extract England & Wales (z0-14)
        run: |
          BUILD="${{ github.event.inputs.build_date }}"
          [ -z "$BUILD" ] && BUILD=$(date -u -d 'yesterday' +%Y%m%d)
          echo "Using Protomaps build $BUILD"
          mkdir -p pipeline/.data/map
          pmtiles extract "https://build.protomaps.com/$BUILD.pmtiles" pipeline/.data/map/ew.pmtiles \
            --bbox=-6.5,49.8,1.8,55.9 --maxzoom=14
          ls -la pipeline/.data/map/ew.pmtiles

      - name: Upload to R2 (S3 endpoint, streaming PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node pipeline/upload-tiles.mjs

      - name: Verify object is live
        run: |
          curl -s -o /dev/null -w 'HEAD map/ew.pmtiles: %{http_code}\n' -I https://pub-ed7263f454104eb1a02055393ee15800.r2.dev/map/ew.pmtiles
