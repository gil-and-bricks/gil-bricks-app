# S1 — SEARCH MONITORING. A console nobody opens is worth nothing, so this comes
# and finds the operator: it opens an ISSUE ASSIGNED TO HIM when a search signal
# falls off a cliff, the same way the health check does, because the app may
# never send email (CLAUDE.md golden rule 6).
#
# DAILY, NOT HOURLY. Search Console data lags by about two days and updates once
# a day; polling it more often would produce identical numbers and a lot of
# commits. 07:20 UTC, after the daily cron, so a data problem and a search
# problem do not arrive at the same minute looking like one fault.
#
# IT IS HARMLESS WITHOUT A CREDENTIAL. Until GOOGLE_SEARCH_CONSOLE_KEY exists
# the script says it cannot run and exits 0. It never invents a number and never
# fails the workflow for a credential that has not been created yet.
name: search

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

concurrency:
  group: search
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    name: search console
    runs-on: ubuntu-latest
    # A monitor that hangs is a monitor that never reports. Six hours is the
    # GitHub default and far too long for a job that makes three API calls.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Pull Search Console, append history, look for a cliff
        id: monitor
        continue-on-error: true
        env:
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
          SEARCH_CONSOLE_SITE: sc-domain:proplaunch.ai
        run: npm run search-monitor -w packages/web 2>&1 | tee search.log

      # The history is committed so a year of it survives, and so the operator
      # can read it without any dashboard at all.
      - name: Commit the history if it moved
        if: always()
        run: |
          if [ -n "$(git status --porcelain packages/web/docs/search-history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/web/docs/search-history.json
            git commit -m "chore(search): daily Search Console history"
            git push
          else
            echo "history unchanged"
          fi

      # Reacts to BOTH: a cliff the monitor found, and the job itself breaking.
      # A monitor that crashes silently is worse than no monitor — the tab looks
      # the same either way.
      - name: Open an assigned issue if something fell off a cliff
        if: failure() || steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'Search: something fell off a cliff';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let fell = [];
            try { fell = JSON.parse(fs.readFileSync('packages/web/docs/.search-alert.json', 'utf8')); } catch {}
            if (fell.length === 0) {
              core.warning('the monitor failed but named no cliff — check the log');
              return;
            }
            const lines = fell.map((f) => `- **${f.id}** — ${f.detail}`).join('\n');
            const body = [
              'A search signal has fallen sharply week on week. The thresholds are in',
              '`packages/web/src/config/searchConsole.ts` and are meant to be tuned.',
              '',
              lines,
              '',
              'Indexation is the one to take seriously: if pages have dropped out of the',
              'index, no amount of ranking work fixes it. Check robots.txt, the noindex',
              'set and the sitemap before anything else.',
              '',
              `Run: ${run}`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'search',
            });
            const existing = open.data.find((i) => i.title === TITLE);
            if (!existing) {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
                labels: ['search'], assignees: [context.repo.owner],
              });
              core.warning(`opened issue #${made.data.number}`);
            } else {
              // Only speak when the set of faults changes. A daily comment on a
              // known problem is how an alert gets muted.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            }
