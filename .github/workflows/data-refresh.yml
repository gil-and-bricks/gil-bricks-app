name: data-refresh

on:
  schedule:
    # Monthly, on the 2nd at 09:17 UTC (offset minute per GitHub guidance).
    # PPD's monthly release lands around the 20th working day (~26th-30th),
    # so running early in the month always picks up the freshest release.
    - cron: "17 9 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EPC_BEARER_TOKEN: ${{ secrets.EPC_BEARER_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repo secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo "::error::Create them per the OPERATOR TO DO block in docs/DECISIONS_LOG.md (S2.2) — the data refresh cannot upload without them."
            exit 1
          fi
          if [ -z "$EPC_BEARER_TOKEN" ]; then
            echo "::error::Missing repo secret EPC_BEARER_TOKEN — the EPC floor-area stage cannot run without it."
            echo "::error::Copy the bearer token from your get-energy-performance-data.communities.gov.uk account page and run: gh secret set EPC_BEARER_TOKEN --repo gil-and-bricks/gil-bricks-app"
            exit 1
          fi
          echo "Secrets present."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download PPD + ONSPD
        run: npm run pipeline:download -w packages/web

      - name: Download + slim EPC bulk (streamed, zip never on disk)
        env:
          EPC_BEARER_TOKEN: ${{ secrets.EPC_BEARER_TOKEN }}
        run: |
          command -v bsdtar >/dev/null || (sudo apt-get update && sudo apt-get install -y libarchive-tools)
          cd packages/web && node pipeline/epc.mjs
          df -h /

      - name: Download UKHPI index
        run: cd packages/web && node pipeline/ukhpi.mjs

      - name: Download + parse deprivation indices (IMD 2025 / WIMD 2025)
        run: cd packages/web && node pipeline/deprivation.mjs

      - name: Build sector files (full England & Wales)
        run: npm run pipeline:build -w packages/web

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run pipeline:upload -w packages/web -- --concurrency 20

      - name: Report
        run: |
          cat packages/web/pipeline/.data/out/manifest.json
          df -h /

      # ---- IF THIS FAILED, SAY SO WHERE IT WILL BE SEEN -----------------------
      # A red tick in a tab nobody opens is not a warning. This opens an issue
      # and ASSIGNS it, because GitHub emails an assignee. One issue per
      # problem, not one per month: a repeat failure comments on the open one.
      - name: Raise an issue if this failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'The monthly data refresh failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The monthly data refresh failed, so the sold-price data on the site has NOT been updated.',
              '',
              `Run: ${run}`,
              '',
              'Meanwhile the site keeps serving the last good data. Once the manifest is 45 days old the footer says so by itself ("This is older than usual"), so nobody is told the figures are current when they are not. Re-run from the Actions tab once the cause is fixed.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.data.find((i) => i.title === TITLE);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              core.notice(`commented on existing issue #${existing.number}`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
                assignees: [context.repo.owner],
              });
              core.notice(`opened issue #${made.data.number}`);
            }
